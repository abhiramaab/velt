server:
  port: 8080

spring:
  application:
    name: velt
  datasource:
    url: jdbc:h2:file:${user.dir}/data/velt;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2
  jackson:
    serialization:
      write-dates-as-timestamps: false

velt:
  jwt:
    secret: velt-studio-dev-secret-key-please-change-in-production-256bit
    expiration-ms: 604800000
  xai:
    api-key: ${XAI_API_KEY:}
    model: grok-4.6
    base-url: https://api.x.ai/v1
